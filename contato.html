<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Solarium Resort</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
      <div class="header_logo">Solarium Resort</div>

      <nav class="menu">
        <a class="one" href="index.html">Home</a>
        <a class="one" href="servicos.html">Serviços</a>
        <a class="one" href="reservas.html">Reserve</a>
        <a class="one" href="contato.html">Contato</a>
        </nav>
    </header>
    <main>
        <section class="reservas">
            <h1>Fale conosco!</h1>
            <p>Preencha o formulário abaixo para entrar em contato com nossa equipe.<br>Responderemos o mais breve possível!</p>

            <form action="#" method="post">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="Telefone">Telefone:</label>
                <input type="tel" id="Telefone" name="Telefone" required>

                <button class="one" type="submit">Enviar contato</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        &copy; 2024-2026 Solarium Resort. Todos os direitos reservados.
    </footer>
</body>
</html>
